name: CI

# Typecheck and the unit tests on every change. The tests read the saved pages
# in tests/fixtures/, so nothing here calls Meetup or Sessionize.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted at workflow level. The job only reads the repository.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and tests
        run: npm run check
